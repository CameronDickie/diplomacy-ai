<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diplomacy — Dev Client</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      font-size: 13px;
      background: #1a1a1a;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── header ── */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #111;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    #header h1 { font-size: 14px; color: #fff; }
    #conn-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #333;
      color: #888;
    }
    #conn-status.connected { background: #1a3a1a; color: #4ec94e; }
    #conn-status.error     { background: #3a1a1a; color: #e05050; }

    /* ── main layout ── */
    #main {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      grid-template-rows: 1fr 160px;
      gap: 1px;
      flex: 1;
      min-height: 0;
      background: #333;
    }

    .panel {
      background: #1a1a1a;
      overflow-y: auto;
      padding: 10px;
    }

    .panel-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 8px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 4px;
    }

    /* ── left panel: lobby / game info ── */
    #panel-left {
      grid-row: 1 / 2;
      grid-column: 1 / 2;
    }

    .field-group { margin-bottom: 10px; }
    .field-group label { display: block; color: #888; margin-bottom: 3px; font-size: 11px; }
    input[type="text"] {
      width: 100%;
      background: #252525;
      border: 1px solid #3a3a3a;
      color: #d4d4d4;
      padding: 4px 6px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 2px;
    }
    input[type="text"]:focus { outline: 1px solid #555; }

    button {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #ccc;
      padding: 4px 10px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      border-radius: 2px;
      width: 100%;
      margin-bottom: 4px;
    }
    button:hover { background: #333; border-color: #666; color: #fff; }
    button.primary { background: #1e3a52; border-color: #2d5a80; color: #8ac4e8; }
    button.primary:hover { background: #254a66; }
    button:disabled { opacity: 0.4; cursor: default; }

    .divider { border: none; border-top: 1px solid #2a2a2a; margin: 10px 0; }

    .stat-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .stat-label { color: #666; }
    .stat-value { color: #bbb; }

    .player-entry {
      padding: 3px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-entry .power-tag {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 2px;
      background: #2a2a2a;
    }
    .player-entry .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .dot.online { background: #4ec94e; }
    .dot.offline { background: #555; }

    /* ── center: map ── */
    #panel-map {
      grid-row: 1 / 2;
      grid-column: 2 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #panel-map img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      opacity: 0.85;
    }

    /* ── right panel: units + orders ── */
    #panel-right {
      grid-row: 1 / 2;
      grid-column: 3 / 4;
    }

    .unit-entry {
      padding: 4px 6px;
      margin-bottom: 3px;
      background: #222;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .unit-entry:hover { background: #2a2a2a; }
    .unit-entry.selected { background: #1e3a52; border-left: 2px solid #2d5a80; }
    .unit-entry.must-retreat { background: #3a1a1a; }
    .unit-type { font-size: 10px; color: #888; width: 14px; }
    .unit-territory { color: #ccc; flex: 1; }
    .unit-power { font-size: 10px; color: #666; }

    .order-form { margin-top: 8px; padding: 8px; background: #222; border-radius: 2px; }
    select {
      width: 100%;
      background: #252525;
      border: 1px solid #3a3a3a;
      color: #d4d4d4;
      padding: 4px 6px;
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 4px;
      border-radius: 2px;
    }
    select:focus { outline: 1px solid #555; }

    .pending-orders { margin-top: 8px; }
    .order-tag {
      font-size: 11px;
      padding: 2px 6px;
      background: #1a2a1a;
      color: #6a9e6a;
      border-radius: 2px;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }
    .order-tag .remove { color: #555; cursor: pointer; }
    .order-tag .remove:hover { color: #e05050; }

    /* ── bottom: event log ── */
    #panel-log {
      grid-row: 2 / 3;
      grid-column: 1 / 4;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
    }
    #log-entries { width: 100%; }
    .log-entry {
      padding: 2px 8px;
      font-size: 11px;
      border-bottom: 1px solid #222;
      display: flex;
      gap: 10px;
    }
    .log-ts { color: #555; flex-shrink: 0; width: 60px; }
    .log-event { color: #7aabcf; flex-shrink: 0; width: 180px; }
    .log-data { color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-entry.incoming .log-event { color: #7aabcf; }
    .log-entry.outgoing .log-event { color: #cf9f7a; }
    .log-entry.system  .log-event { color: #666; }
    .log-entry.errored .log-event { color: #e05050; }

    #phase-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #2a2a2a;
      color: #888;
      margin-left: auto;
    }
    #phase-badge.orders   { background: #1a2a3a; color: #7aabcf; }
    #phase-badge.retreats { background: #3a2a1a; color: #cf9f7a; }
    #phase-badge.builds   { background: #1a3a1a; color: #6ac96a; }
  </style>
</head>
<body>

<div id="header">
  <h1>Diplomacy — Dev Client</h1>
  <span id="conn-status">disconnected</span>
  <span id="phase-badge" style="display:none"></span>
  <span id="game-id-display" style="color:#555; margin-left:auto; font-size:11px;"></span>
</div>

<div id="main">

  <!-- Left: Lobby / Game Info -->
  <div class="panel" id="panel-left">
    <div id="section-lobby">
      <div class="panel-title">Connect</div>
      <div class="field-group">
        <label>Player Name</label>
        <input type="text" id="input-name" placeholder="your name" value="Dev Player" />
      </div>
      <button class="primary" id="btn-create">Create Game</button>
      <hr class="divider" />
      <div class="field-group">
        <label>Game ID</label>
        <input type="text" id="input-gameid" placeholder="paste game id" />
      </div>
      <button id="btn-join">Join Game</button>
    </div>

    <div id="section-game" style="display:none">
      <div class="panel-title">Game</div>
      <div class="stat-row"><span class="stat-label">Year</span><span class="stat-value" id="info-year">—</span></div>
      <div class="stat-row"><span class="stat-label">Season</span><span class="stat-value" id="info-season">—</span></div>
      <div class="stat-row"><span class="stat-label">Phase</span><span class="stat-value" id="info-phase">—</span></div>
      <div class="stat-row"><span class="stat-label">My Power</span><span class="stat-value" id="info-power">—</span></div>
      <div class="stat-row"><span class="stat-label">Submitted</span><span class="stat-value" id="info-submitted">—</span></div>
      <hr class="divider" />
      <div class="panel-title">Players</div>
      <div id="player-list"></div>
      <hr class="divider" />
      <div class="panel-title">Supply Centers</div>
      <div id="supply-list"></div>
    </div>
  </div>

  <!-- Center: Map placeholder -->
  <div class="panel" id="panel-map">
    <img id="map-img" src="/diplomacy.svg" alt="Diplomacy map placeholder" />
  </div>

  <!-- Right: Units + Orders -->
  <div class="panel" id="panel-right">
    <div class="panel-title">Units <span id="unit-count" style="color:#555"></span></div>
    <div id="unit-list"></div>

    <div id="order-form-wrap" style="display:none">
      <div class="order-form">
        <div style="font-size:11px; color:#888; margin-bottom:6px;">
          Order: <strong id="order-unit-label" style="color:#ccc"></strong>
        </div>
        <select id="select-order-type">
          <option value="HOLD">HOLD</option>
          <option value="MOVE">MOVE</option>
          <option value="SUPPORT_HOLD">SUPPORT HOLD</option>
          <option value="SUPPORT_MOVE">SUPPORT MOVE</option>
          <option value="CONVOY">CONVOY</option>
        </select>
        <select id="select-target" style="display:none">
          <option value="">— target territory —</option>
        </select>
        <select id="select-support-unit" style="display:none">
          <option value="">— unit to support —</option>
        </select>
        <select id="select-support-dest" style="display:none">
          <option value="">— support destination —</option>
        </select>
        <button id="btn-add-order">Add Order</button>
      </div>

      <div class="pending-orders">
        <div style="font-size:10px; color:#555; margin-bottom:4px; text-transform:uppercase; letter-spacing:1px">Pending Orders</div>
        <div id="pending-order-list"></div>
        <button class="primary" id="btn-submit-orders" style="margin-top:6px" disabled>Submit Orders</button>
      </div>
    </div>
  </div>

  <!-- Bottom: Event Log -->
  <div class="panel" id="panel-log">
    <div id="log-entries"></div>
  </div>

</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
