<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <!-- Background -->
  <rect width="800" height="540" fill="#1e2830"/>
  <rect x="1" y="1" width="798" height="538" fill="none" stroke="#2a3a4a" stroke-width="1"/>

  <!-- Rough region blobs (purely decorative) -->
  <!-- England (NW) -->
  <ellipse cx="170" cy="130" rx="70" ry="55" fill="#252e3a" stroke="#2d5a80" stroke-width="1" opacity="0.7"/>
  <!-- France (W) -->
  <ellipse cx="220" cy="240" rx="80" ry="65" fill="#252e3a" stroke="#2d5a80" stroke-width="1" opacity="0.7"/>
  <!-- Germany (C) -->
  <ellipse cx="370" cy="200" rx="65" ry="55" fill="#252e3a" stroke="#2d5a80" stroke-width="1" opacity="0.7"/>
  <!-- Austria (C-E) -->
  <ellipse cx="460" cy="270" rx="75" ry="55" fill="#252e3a" stroke="#2d5a80" stroke-width="1" opacity="0.7"/>
  <!-- Italy (S) -->
  <ellipse cx="330" cy="350" rx="55" ry="70" fill="#252e3a" stroke="#2d5a80" stroke-width="1" opacity="0.7"/>
  <!-- Russia (NE) -->
  <ellipse cx="580" cy="160" rx="110" ry="80" fill="#252e3a" stroke="#2d5a80" stroke-width="1" opacity="0.7"/>
  <!-- Turkey (SE) -->
  <ellipse cx="590" cy="370" rx="90" ry="55" fill="#252e3a" stroke="#2d5a80" stroke-width="1" opacity="0.7"/>

  <!-- Sea zones fill -->
  <rect x="30" y="30" width="740" height="480" fill="none"/>

  <!-- Power labels -->
  <text x="170" y="125" text-anchor="middle" font-size="11" font-family="monospace" fill="#8080e0" font-weight="bold">ENGLAND</text>
  <text x="170" y="140" text-anchor="middle" font-size="9" font-family="monospace" fill="#555">Lon · Edi · Lvp</text>

  <text x="220" y="235" text-anchor="middle" font-size="11" font-family="monospace" fill="#80aee0" font-weight="bold">FRANCE</text>
  <text x="220" y="250" text-anchor="middle" font-size="9" font-family="monospace" fill="#555">Par · Bre · Mar</text>

  <text x="370" y="195" text-anchor="middle" font-size="11" font-family="monospace" fill="#aaaaaa" font-weight="bold">GERMANY</text>
  <text x="370" y="210" text-anchor="middle" font-size="9" font-family="monospace" fill="#555">Ber · Mun · Kie</text>

  <text x="460" y="265" text-anchor="middle" font-size="11" font-family="monospace" fill="#e08080" font-weight="bold">AUSTRIA</text>
  <text x="460" y="280" text-anchor="middle" font-size="9" font-family="monospace" fill="#555">Vie · Bud · Tri</text>

  <text x="330" y="345" text-anchor="middle" font-size="11" font-family="monospace" fill="#80c080" font-weight="bold">ITALY</text>
  <text x="330" y="360" text-anchor="middle" font-size="9" font-family="monospace" fill="#555">Rom · Nap · Ven</text>

  <text x="580" y="155" text-anchor="middle" font-size="11" font-family="monospace" fill="#c0c080" font-weight="bold">RUSSIA</text>
  <text x="580" y="170" text-anchor="middle" font-size="9" font-family="monospace" fill="#555">Mos · StP · War · Sev</text>

  <text x="590" y="365" text-anchor="middle" font-size="11" font-family="monospace" fill="#e0c080" font-weight="bold">TURKEY</text>
  <text x="590" y="380" text-anchor="middle" font-size="9" font-family="monospace" fill="#555">Con · Ank · Smy</text>

  <!-- Placeholder notice -->
  <text x="400" y="490" text-anchor="middle" font-size="11" font-family="monospace" fill="#3a4a5a">MAP PLACEHOLDER — replace diplomacy.svg with the real board</text>

  <!-- Border tick marks to look vaguely map-like -->
  <line x1="30" y1="30" x2="770" y2="30"   stroke="#2a3a4a" stroke-width="0.5"/>
  <line x1="30" y1="510" x2="770" y2="510" stroke="#2a3a4a" stroke-width="0.5"/>
  <line x1="30" y1="30"  x2="30"  y2="510" stroke="#2a3a4a" stroke-width="0.5"/>
  <line x1="770" y1="30" x2="770" y2="510" stroke="#2a3a4a" stroke-width="0.5"/>
</svg>
