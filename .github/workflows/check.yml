name: Build and test

on:
  pull_request:
  push:
    branches: [master, main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep coverage for the toolchain families used by the Dockerfile.
          - os: ubuntu-latest
            node: '22.x'
            go: '1.23.x'
          # Exercise the current Homebrew toolchain on macOS too.
          - os: macos-latest
            node: '26.x'
            go: '1.27.x'
    env:
      GOCACHE: ${{ github.workspace }}/engine/.cache/go-build
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: engine/go.sum
      - name: Restore locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run server and rules-engine tests
        run: npm run check

  package:
    name: Production image source and notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag diplomacy:ci .
      - name: Check shipped source and browser notices
        run: |
          docker run --rm --entrypoint sh diplomacy:ci -c '
            test -f /app/source/engine/go.mod &&
            test -f /app/source/third_party/godip/LICENSE &&
            test -f /app/source/client/src/ui/App.tsx &&
            test -f /app/client/dist/legal.html &&
            cmp /app/LICENSE /app/client/dist/LICENSE.txt &&
            cmp /app/LIBRE_BASKERVILLE_OFL.txt /app/client/dist/LIBRE_BASKERVILLE_OFL.txt
          '
