name: Build and test

# Runs only when started by hand (Actions → Build and test → Run workflow): hosted minutes are paid for.
# The same checks run locally with scripts/verify.sh (add --image for the production image).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep coverage for the toolchain families used by the Dockerfile.
          - os: ubuntu-latest
            node: '22.x'
            go: '1.23.x'
          # Exercise the current Homebrew toolchain on macOS too.
          - os: macos-latest
            node: '26.x'
            go: '1.27.x'
    env:
      GOCACHE: ${{ github.workspace }}/engine/.cache/go-build
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: engine/go.sum
      - name: Restore locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run server and rules-engine tests
        run: npm run check

  browser:
    name: Browser journeys (Chromium, mock opponents)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ github.workspace }}/engine/.cache/go-build
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: engine/go.sum
      - name: Restore locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # Local profile, temporary database, generated test sessions, mock opponents: no secrets and no paid service.
      - name: Run browser journeys
        run: npm run test:e2e

  package:
    name: Production image source and notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag diplomacy:ci .
      - name: Check shipped source and browser notices
        run: |
          docker run --rm --entrypoint sh diplomacy:ci -c '
            test -f /app/source/engine/go.mod &&
            test -f /app/source/third_party/godip/LICENSE &&
            test -f /app/source/client/src/ui/App.tsx &&
            test -f /app/source/server/fixtures/development/tunis-expedition.v1.json &&
            node /app/server/dist/fixtures/cli.js validate /app/server/fixtures/development/retreat-position.v1.json &&
            test -f /app/client/dist/legal.html &&
            cmp /app/LICENSE /app/client/dist/LICENSE.txt &&
            cmp /app/LIBRE_BASKERVILLE_OFL.txt /app/client/dist/LIBRE_BASKERVILLE_OFL.txt
          '
      - name: Check non-root durable storage and backup
        run: |
          CI_STORAGE_VOLUME="diplomacy-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$CI_STORAGE_VOLUME"
          trap 'docker volume rm "$CI_STORAGE_VOLUME"' EXIT
          docker run --rm --mount "type=volume,source=$CI_STORAGE_VOLUME,target=/data" --entrypoint node diplomacy:ci server/dist/storage/cli.js init /data/game.sqlite
          docker run --rm --mount "type=volume,source=$CI_STORAGE_VOLUME,target=/data" --entrypoint node diplomacy:ci server/dist/storage/cli.js backup /data/game.sqlite /data/backup.sqlite
          docker run --rm --mount "type=volume,source=$CI_STORAGE_VOLUME,target=/data" --entrypoint node diplomacy:ci server/dist/storage/cli.js restore /data/backup.sqlite /data/restored.sqlite
          docker run --rm --mount "type=volume,source=$CI_STORAGE_VOLUME,target=/data" --entrypoint node diplomacy:ci -e 'const fs=require("node:fs"); for(const path of ["/data/game.sqlite","/data/backup.sqlite","/data/restored.sqlite"]) { const s=fs.statSync(path); if(s.uid!==10001 || (s.mode&511)!==384) process.exit(1); }'
