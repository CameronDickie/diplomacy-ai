services:
  app:
    image: ${DIPLOMACY_IMAGE:?Set DIPLOMACY_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/app.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DIPLOMACY_ENGINE_PATH: /app/engine/bin/diplomacy-engine
    volumes:
      - ./data:/data
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config

